[workspace]
name = "yardl"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]
requires-pixi = "==0.70.0"

# Core dependencies, also required in CI.
[dependencies]
cmake = "4.1.2.*"
fmt = "11.2.0.*"
gmock = "1.17.0.*"
gtest = "1.17.0.*"
hdf5 = "1.14.6.*"
howardhinnant_date = "3.0.4.*"
just = "1.43.0.*"
ninja = "1.13.1.*"
nlohmann_json = "3.12.0.*"
numpy = "2.3.3.*"
pyright = "1.1.406.*"
pytest = "8.4.2.*"
python = "3.13.7.*"
rich = "14.1.0.*"
xtensor = "0.27.1.*"

[target.linux-64.dependencies]
gcc_linux-64 = "15.1.0.*"
gxx_linux-64 = "15.1.0.*"

[target.linux-aarch64.dependencies]
gcc_linux-aarch64 = "15.1.0.*"
gxx_linux-aarch64 = "15.1.0.*"

# Additional tooling for local development (not needed in CI).
[feature.dev.dependencies]
bash-completion = "2.11.*"
ccache = "4.11.3.*"
clang-format = "21.1.2.*"
gdb = "16.3.*"
ipykernel = "6.30.1.*"
nodejs = "24.9.0.*"
shellcheck = "0.10.0.*"

[feature.dev.target.linux-64.dependencies]
valgrind = "3.25.1.*"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
