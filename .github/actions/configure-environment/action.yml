name: Configure Environment
description: Configures the pixi environment
runs:
  using: composite
  steps:

    - name: Read tool versions from repo config
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        # yq is pre-installed on GitHub-hosted runners.
        # requires-pixi must be pinned with '==' (e.g. "==0.70.0").
        requires_pixi="$(yq -p toml -oy '.workspace.requires-pixi' pixi.toml)"
        if [[ "${requires_pixi}" != ==* ]]; then
          echo "requires-pixi in pixi.toml must be pinned with '==' (got: '${requires_pixi}')" >&2
          exit 1
        fi
        pixi_version="${requires_pixi#==}"

        echo "pixi_version=${pixi_version}" >> "${GITHUB_OUTPUT}"

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@8ca4608ef7f4daeb54f5205b20d0b7cb42f11143 # v0.8.14
      with:
        pixi-version: v${{ steps.versions.outputs.pixi_version }}
        # Only the "default" environment is needed in CI; the "dev" environment
        # contains extra tooling that is only used for local development.
        environments: default
        activate-environment: true
        cache: true

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: tooling/go.mod
        cache-dependency-path: tooling/go.sum

    - name: Setup Matlab
      uses: matlab-actions/setup-matlab@aa8bbc7b76daa63c5d456d1430cbd6cb5b626ab4 # v2.7.0
      with:
        release: R2022b
        cache: true

    # Workaround to running `matlab -batch` from within justfile and Python
    # See: https://github.com/matlab-actions/run-command/issues/53
    - name: Get run-matlab-command
      shell: bash
      run: |
        wget -O /usr/local/bin/run-matlab-command https://ssd.mathworks.com/supportfiles/ci/run-matlab-command/v2/glnxa64/run-matlab-command
        chmod +x /usr/local/bin/run-matlab-command
