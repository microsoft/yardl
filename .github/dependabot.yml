version: 2
updates:
  - package-ecosystem: gomod
    directory: /tooling
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns:
          - "*"
      gomod-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
